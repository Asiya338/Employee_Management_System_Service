spring.datasource.url=jdbc:mysql://localhost:3306/employee_management

spring.datasource.username=YOUR_USERNAME_HERE
spring.datasource.password=YOUR_PASSWORD_HERE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

auth.service.base-url=http://localhost:8086/api/v1/auth

management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always

management.health.circuitbreakers.enabled=true 


resilience4j.circuitbreaker.instances.employee-management-system.failureRateThreshold=40
resilience4j.circuitbreaker.instances.employee-management-system.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.employee-management-system.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.employee-management-system.register-health-indicator=true
resilience4j.circuitbreaker.instances.employee-management-system.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.employee-management-system.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.employee-management-system.slidingWindowSize=10
resilience4j.circuitbreaker.instances.employee-management-system.slidingWindowType=COUNT_BASED


resilience4j.circuitbreaker.instances.authService.recordExceptions=\
io.netty.handler.timeout.ReadTimeoutException,\
org.springframework.web.reactive.function.client.WebClientRequestException,\
com.example.demo.exception.AuthServiceUnavailableException

resilience4j.circuitbreaker.instances.authService.ignoreExceptions=\
org.springframework.security.access.AccessDeniedException



